name = "oficiospro-web"
main = "worker/index.ts"
compatibility_date = "2026-06-06"

routes = [
  { pattern = "www.oficiospro.cl", custom_domain = true },
  { pattern = "oficiospro.cl", custom_domain = true },
]

[assets]
directory = "./out"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/registro-publico-externo/*"]

[[d1_databases]]
binding = "DB"
database_name = "oficiospro-leads"
database_id = "aa92cf32-a92a-436d-b59d-12edcf332221"
